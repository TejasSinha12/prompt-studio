[project]
name = "prompt-studio-api"
version = "0.1.0"
description = "Local-first prompt optimization workbench - backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<0.144",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<2",
  "uvicorn>=0.54,<0.55",
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"migrations/**" = ["E501", "W291"]
